services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://app:localdev@postgres:5432/shortener
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/shortener?sslmode=disable
      SQS_QUEUE_URL: http://localstack:4566/000000000000/click-events
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./services/dashboard
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/shortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
