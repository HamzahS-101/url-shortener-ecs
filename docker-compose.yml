services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2.17-alpine

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://app:localdev@postgres:5432/shortener
      REDIS_URL: redis://redis:6379/0
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/click-events
      AWS_ENDPOINT_URL: http://elasticmq:9324
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      BASE_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticmq:
        condition: service_started

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/shortener?sslmode=disable
      SQS_QUEUE_URL: http://elasticmq:9324/000000000000/click-events
      AWS_ENDPOINT_URL: http://elasticmq:9324
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      postgres:
        condition: service_healthy
      elasticmq:
        condition: service_started

  dashboard:
    build: ./services/dashboard
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/shortener?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
